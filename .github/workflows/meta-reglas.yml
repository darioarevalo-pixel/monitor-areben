name: Automatizaciones de Meta Ads

# 10:50 UTC = 07:50 en Argentina, y aterriza ~08:30: media hora después de `meta-snapshot.yml`,
# que es de quien depende. Si la foto de hoy todavía no está, las reglas evaluarían la de ayer y el
# Panel amanecería con un día de atraso sin decirlo.
# 🔴 Los 30 minutos de separación son el contrato: se movió de las 04:00 a las 08:00 el 23-ago-2026
# PORQUE se movió la foto, no por sí mismo. ⛔ Tocar una hora sin la otra rompe la cadena en
# silencio — el motor sale verde igual, evaluando un día que no está cerrado.
# 🔑 La foto tiene AHORA un segundo corte a la tarde (~20:00). Éste NO lo sigue a propósito: las
# reglas juzgan días CERRADOS, y a las 20:00 el día va por el 85%.
#
# 🔑 A diferencia de la foto, esto NO habla con Meta: lee `meta_ads_snapshot_dia` de Supabase y nada
# más. No necesita `META_ADS_TOKEN`, no consume cupo de Graph, y sigue andando el día que Meta se
# caiga o el token venza. Corre acá igual porque es trabajo de fondo y Hobby corta a los 10 s.
# 🔒 Candado propio: éste escribe en Meta sin que nadie lo apriete. Con el cron horario, una
# corrida que se pasara de los 60 minutos arrancaría encima de sí misma y habría dos procesos
# avanzando los mismos planes sobre cuentas publicitarias reales. Hoy tarda ~34 s, así que es un
# seguro, no un problema actual. `cancel-in-progress: false`: un escalón a medias se espera.
concurrency:
  group: meta-ads-escritura
  cancel-in-progress: false

on:
  schedule:
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      calibrar:
        description: 'true = corre TODOS los presets hacia atrás y no escribe nada'
        required: false
        default: 'false'
      simulacro:
        description: 'true = evalúa las reglas activas pero no guarda los hallazgos'
        required: false
        default: 'false'
      linea:
        description: 'Una sola marca: bdi | zattia | stunned (vacío = todas)'
        required: false
        default: ''
      dias:
        description: 'Días de ventana para el calibrador (default 90)'
        required: false
        default: ''

jobs:
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` y no `npm install`: instala EXACTAMENTE lo que dice package-lock.json. Con
      # `install`, un sync de producción resolvía dependencias frescas cada noche y podía traerse
      # una versión menor distinta a la fijada, sin que nadie lo pidiera ni se enterara.
      - name: Instalar dependencias
        run: npm ci

      - name: Evaluar las reglas
        env:
          # La base de BDI: las tres tablas son cross-marca porque las cuentas son compartidas.
          # No va META_ADS_TOKEN a propósito — este script no habla con Meta.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENTRADA_CALIBRAR: ${{ inputs.calibrar }}
          ENTRADA_SIMULACRO: ${{ inputs.simulacro }}
          ENTRADA_LINEA: ${{ inputs.linea }}
          ENTRADA_DIAS: ${{ inputs.dias }}
          # El mail de la mañana, por el MISMO SES que ya usa `areben-mailer` (us-east-1, dominio
          # verificado con DKIM). ⚠️ **Su ausencia NO rompe la corrida a propósito**: sin las
          # credenciales el script lo dice fuerte en el log y sale verde igual — el trabajo de este
          # reloj son los hallazgos, y el mail es un rider. Con las credenciales puestas, un envío
          # que falla SÍ tiñe de rojo.
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MAIL_HALLAZGOS_A: ${{ vars.MAIL_HALLAZGOS_A }}
        run: |
          args=""
          [ "$ENTRADA_CALIBRAR" = "true" ] && args="$args --calibrar"
          [ "$ENTRADA_SIMULACRO" = "true" ] && args="$args --simulacro"
          [ -n "$ENTRADA_LINEA" ] && args="$args --linea $ENTRADA_LINEA"
          [ -n "$ENTRADA_DIAS" ] && args="$args --dias $ENTRADA_DIAS"
          node scripts/evaluar-reglas-meta.mjs $args
