name: Purga histórica de ventas

# Pasada única sobre todo el histórico: relee mes por mes desde Gestión Nube, corrige
# lo que cambió y borra lo que ya no existe. El sync diario solo cubre 90 días para
# atrás; esto limpia el resto (ver scripts/purga-historica.js).
#
# ARRANCA EN SIMULACIÓN: con `aplicar` en false no escribe ni borra nada, solo informa
# mes por mes cuántas ventas borraría. Se mira el número y recién después se corre con
# `aplicar` en true.

# 🔒 **Los ocho workflows que hablan con Gestión Nube comparten UN candado.** No es paranoia de
# libro: `scripts/lib/gn-rate-limit.mjs:12` documenta que "el diario del 11-ago hizo 29 páginas
# seguidas antes de chocar y el rápido del 12 chocó a la séptima, así que hay una ventana más larga
# que no conocemos". Esa firma —cortes que no se explican por el volumen de UNA corrida— es
# exactamente la de dos jobs compartiendo cupo. Y hasta hoy nada impedía que se pisaran: los dos
# diarios están agendados en el MISMO minuto (`0 6 * * *`) y cualquiera podía disparar un sync a
# mano encima. `cancel-in-progress: false` porque un sync a medias no se cancela, se espera.
concurrency:
  group: gestion-nube
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      marca:
        description: 'Marca (bdi o zattia)'
        required: true
        default: 'bdi'
      desde:
        description: 'Desde (YYYY-MM-DD)'
        required: true
        default: '2024-01-01'
      hasta:
        description: 'Hasta (YYYY-MM-DD). Vacío = hoy'
        required: false
        default: ''
      aplicar:
        description: '¿Aplicar de verdad? (en false solo simula)'
        type: boolean
        required: true
        default: false
      tope:
        description: 'Tope de borrado por mes (0.1 = 10%)'
        required: false
        default: '0.1'

jobs:
  purga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` y no `npm install`: instala EXACTAMENTE lo que dice package-lock.json. Con
      # `install`, un sync de producción resolvía dependencias frescas cada noche y podía traerse
      # una versión menor distinta a la fijada, sin que nadie lo pidiera ni se enterara.
      - name: Instalar dependencias
        run: npm ci

      - name: Purga histórica
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GN_TOKEN:             ${{ secrets.GN_TOKEN }}
          ZATTIA_SUPABASE_URL:  ${{ secrets.ZATTIA_SUPABASE_URL }}
          ZATTIA_SUPABASE_KEY:  ${{ secrets.ZATTIA_SUPABASE_KEY }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
          GN_TOKEN_ZATTIA:      ${{ secrets.GN_TOKEN_ZATTIA }}
        # `aplicar` se pasa SIEMPRE con su valor y decide el script, en vez de que el
        # YAML decida si agrega el flag. Si la casilla llegara como el texto "false"
        # en lugar de un booleano, `inputs.aplicar && '--aplicar'` la tomaría por
        # verdadera y una simulación borraría de verdad. El script solo acepta el
        # booleano true o el texto "true"; cualquier otra cosa simula.
        run: |
          node scripts/purga-historica.js \
            --marca=${{ inputs.marca }} \
            --desde=${{ inputs.desde }} \
            ${{ inputs.hasta && format('--hasta={0}', inputs.hasta) || '' }} \
            --tope=${{ inputs.tope }} \
            --aplicar=${{ inputs.aplicar }}

      # Lo borrado ya no existe en Gestión Nube: este archivo es la única vuelta atrás.
      # Se guarda 90 días. `if: always()` para que quede incluso si la corrida se cae
      # a mitad de camino, que es justo cuando más se necesita.
      - name: Guardar el respaldo de lo borrado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-purga-${{ inputs.marca }}
          path: respaldo-purga-*.jsonl
          if-no-files-found: ignore
          retention-days: 90
