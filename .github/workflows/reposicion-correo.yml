name: Correo de la reposición (10:00)

# Cómo quedó la reposición de Zattia cuando abre el local (Darío, 11/12-oct-2026). Sólo lee
# `repo_armado` y manda el correo: no necesita syncs. Ficha: `docs/secciones/reposicion.md`.
#
# 🔴 ⛔ Tiene `schedule`, a propósito: los crons de GitHub de este repo llegan HORAS tarde (medido el
# 30-sep-2026, ver `parte-manana.yml`). Lo dispara a las 13:00 UTC (10:00 AR) el reloj de Maketa,
# igual que el parte de la mañana.
concurrency:
  group: reposicion-correo
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      simulacro:
        description: 'true = arma el correo y lo imprime, pero ⛔ NO lo manda'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  correo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Armar y mandar el correo
        env:
          ZATTIA_SUPABASE_URL: ${{ secrets.ZATTIA_SUPABASE_URL }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MAIL_REPOSICION_A: ${{ vars.MAIL_REPOSICION_A }}
          ENTRADA_SIMULACRO: ${{ inputs.simulacro }}
          CORREO_HTML: correo.html
        run: node scripts/reposicion-correo.mjs

      - name: Guardar el HTML del correo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correo-html
          path: correo.html
          if-no-files-found: ignore
          retention-days: 7
