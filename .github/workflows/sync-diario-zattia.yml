name: Sync diario — Zattia

# 🔒 **Los ocho workflows que hablan con Gestión Nube comparten UN candado.** No es paranoia de
# libro: `scripts/lib/gn-rate-limit.mjs:12` documenta que "el diario del 11-ago hizo 29 páginas
# seguidas antes de chocar y el rápido del 12 chocó a la séptima, así que hay una ventana más larga
# que no conocemos". Esa firma —cortes que no se explican por el volumen de UNA corrida— es
# exactamente la de dos jobs compartiendo cupo. Y hasta hoy nada impedía que se pisaran: los dos
# diarios están agendados en el MISMO minuto (`0 6 * * *`) y cualquiera podía disparar un sync a
# mano encima. `cancel-in-progress: false` porque un sync a medias no se cancela, se espera.
concurrency:
  group: gestion-nube
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` y no `npm install`: instala EXACTAMENTE lo que dice package-lock.json. Con
      # `install`, un sync de producción resolvía dependencias frescas cada noche y podía traerse
      # una versión menor distinta a la fijada, sin que nadie lo pidiera ni se enterara.
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar sync diario Zattia
        env:
          ZATTIA_SUPABASE_URL: ${{ secrets.ZATTIA_SUPABASE_URL }}
          ZATTIA_SUPABASE_KEY: ${{ secrets.ZATTIA_SUPABASE_KEY }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
          GN_TOKEN_ZATTIA: ${{ secrets.GN_TOKEN_ZATTIA }}
          DATABASE_URL_ZATTIA: ${{ secrets.DATABASE_URL_ZATTIA }}
        run: node scripts/sync-diario-zattia.js

      # El stock de las líneas que ya pasaron al ERP (`erp_corte`: Stunned desde el 28-oct, BDI el 15/16-nov, Zattia el 23-nov)
      # sale del LIBRO del motor, ⛔ de GN (el sync de arriba ya no escribe esas filas). Sin corte, el script sale sin tocar nada.
      # Ver `lib/erp/inventario-espejo.core.js`.
      - name: Stock del ERP al espejo
        # 🔴 Corre AUNQUE falle el paso de GN (un 429 es frecuente): sin esto el espejo de la línea que ya vive en el ERP quedaba
        # congelado —Caja, Reposición, Liquidación y el parte con stock viejo y 0 ventas— (revisión 10-nov). Escribe sólo esas filas.
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL_ZATTIA: ${{ secrets.DATABASE_URL_ZATTIA }}
          ZATTIA_SUPABASE_URL: ${{ secrets.ZATTIA_SUPABASE_URL }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
        run: node scripts/erp-inventario-espejo.mjs zattia

      # Las ventas nacidas en el ERP DESPUÉS del corte de su línea (`erp_corte`: Stunned desde el 28-oct, Zattia el 23-nov), al
      # espejo de `ventas` / `venta_detalles`: sin esto Liquidación, el ETL y Reposición ven 0 ventas de la línea cortada.
      # Va DESPUÉS del sync de GN. Ver `lib/erp/ventas-espejo.core.js`.
      - name: Ventas del ERP al espejo
        # 🔴 Corre AUNQUE falle el paso de GN (un 429 es frecuente): sin esto el espejo de la línea que ya vive en el ERP quedaba
        # congelado —Caja, Reposición, Liquidación y el parte con stock viejo y 0 ventas— (revisión 10-nov). Escribe sólo esas filas.
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL_ZATTIA: ${{ secrets.DATABASE_URL_ZATTIA }}
          ZATTIA_SUPABASE_URL: ${{ secrets.ZATTIA_SUPABASE_URL }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
        run: node scripts/erp-ventas-espejo.mjs zattia
