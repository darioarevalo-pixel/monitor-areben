name: Ensayo real de escritura en Meta

# El ensayo que `validate_only` no puede hacer: crear un conjunto DE VERDAD, mirarlo campo por campo
# y borrarlo. Ver la cabecera de `scripts/crear-y-borrar-meta.mjs`.
#
# 🔑 **Corre acá y no en la máquina de Bruno por una sola razón: el token.** `META_ADS_TOKEN` ya está
# en los secrets de este repo desde el 8-ago, y su valor no se puede recuperar ni de Vercel ni de
# Actions. Hacerlo localmente obligaría a generar un token más en el system user `monitor-ads` —una
# credencial viva más, para siempre, por un ensayo que se corre cada tanto—. Acá no hace falta
# ninguno nuevo.
#
# ⛔ Sólo `workflow_dispatch`: esto ESCRIBE en una cuenta publicitaria real. Nunca por cron.
# 🔒 Candado propio: éste escribe en Meta sin que nadie lo apriete. Con el cron horario, una
# corrida que se pasara de los 60 minutos arrancaría encima de sí misma y habría dos procesos
# avanzando los mismos planes sobre cuentas publicitarias reales. Hoy tarda ~34 s, así que es un
# seguro, no un problema actual. `cancel-in-progress: false`: un escalón a medias se espera.
concurrency:
  group: meta-ads-escritura
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      conjunto:
        description: 'Id del conjunto que se usa de referencia (vacío + cuenta = listar los activos)'
        required: false
        default: ''
      cuenta:
        description: 'Cuenta publicitaria, sólo para listar conjuntos y elegir uno'
        required: false
        default: ''
      crear:
        description: 'true = CREA el conjunto de verdad (pausado) y después lo borra. false = sólo valida.'
        required: false
        default: 'false'
      dejar:
        description: 'true = no lo borra al terminar. Queda pausado y hay que borrarlo a mano.'
        required: false
        default: 'false'
      probar_rojo:
        description: 'true = le mete un defecto a la relectura para probar que el ensayo lo caza. Verde = lo cazó.'
        required: false
        default: 'false'

jobs:
  ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # `npm ci` y no `npm install`: instala EXACTAMENTE lo que dice package-lock.json. Con
      # `install`, un sync de producción resolvía dependencias frescas cada noche y podía traerse
      # una versión menor distinta a la fijada, sin que nadie lo pidiera ni se enterara.
      - name: Instalar dependencias
        run: npm ci

      - name: Correr el ensayo
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ENTRADA_CONJUNTO: ${{ inputs.conjunto }}
          ENTRADA_CUENTA: ${{ inputs.cuenta }}
          ENTRADA_CREAR: ${{ inputs.crear }}
          ENTRADA_DEJAR: ${{ inputs.dejar }}
          ENTRADA_PROBAR_ROJO: ${{ inputs.probar_rojo }}
        run: |
          args=""
          if [ -n "$ENTRADA_CONJUNTO" ]; then
            args="--conjunto $ENTRADA_CONJUNTO"
            [ "$ENTRADA_CREAR" = "true" ] && args="$args --crear"
            [ "$ENTRADA_DEJAR" = "true" ] && args="$args --dejar"
            [ "$ENTRADA_PROBAR_ROJO" = "true" ] && args="$args --probar-rojo"
          else
            args="--listar --cuenta $ENTRADA_CUENTA"
          fi
          node scripts/crear-y-borrar-meta.mjs $args
