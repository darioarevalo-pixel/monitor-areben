name: Auditar ventas (solo lectura)

# Compara el espejo contra Gestión Nube y clasifica qué pasaría si purgáramos los
# renglones, usando `items_sold` —las unidades que GN declara para cada venta— como
# árbitro. NO escribe ni borra: es la verificación previa a decidir una purga.
# Ver scripts/auditar-ventas.js.

# 🔒 **Los ocho workflows que hablan con Gestión Nube comparten UN candado.** No es paranoia de
# libro: `scripts/lib/gn-rate-limit.mjs:12` documenta que "el diario del 11-ago hizo 29 páginas
# seguidas antes de chocar y el rápido del 12 chocó a la séptima, así que hay una ventana más larga
# que no conocemos". Esa firma —cortes que no se explican por el volumen de UNA corrida— es
# exactamente la de dos jobs compartiendo cupo. Y hasta hoy nada impedía que se pisaran: los dos
# diarios están agendados en el MISMO minuto (`0 6 * * *`) y cualquiera podía disparar un sync a
# mano encima. `cancel-in-progress: false` porque un sync a medias no se cancela, se espera.
concurrency:
  group: gestion-nube
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      marca:
        description: 'Marca (bdi o zattia)'
        required: true
        default: 'bdi'
      desde:
        description: 'Desde (YYYY-MM-DD)'
        required: true
        default: '2026-05-01'
      hasta:
        description: 'Hasta (YYYY-MM-DD)'
        required: false
        default: ''
      fantasmas:
        description: 'Listar las ventas que el listado de GN no trae'
        type: boolean
        required: false
        default: false
      verificar:
        description: 'Preguntar por cada una de esas ventas de a una (prueba si existe o está borrada)'
        type: boolean
        required: false
        default: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` y no `npm install`: instala EXACTAMENTE lo que dice package-lock.json. Con
      # `install`, un sync de producción resolvía dependencias frescas cada noche y podía traerse
      # una versión menor distinta a la fijada, sin que nadie lo pidiera ni se enterara.
      - name: Instalar dependencias
        run: npm ci

      - name: Auditar
        env:
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY:        ${{ secrets.SUPABASE_SERVICE_KEY }}
          GN_TOKEN:                    ${{ secrets.GN_TOKEN }}
          ZATTIA_SUPABASE_URL:         ${{ secrets.ZATTIA_SUPABASE_URL }}
          ZATTIA_SUPABASE_KEY:         ${{ secrets.ZATTIA_SUPABASE_KEY }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
          GN_TOKEN_ZATTIA:             ${{ secrets.GN_TOKEN_ZATTIA }}
        run: |
          node scripts/auditar-ventas.js \
            --marca=${{ inputs.marca }} \
            --desde=${{ inputs.desde }} \
            ${{ inputs.hasta && format('--hasta={0}', inputs.hasta) || '' }} \
            --fantasmas=${{ inputs.fantasmas }} \
            --verificar=${{ inputs.verificar }}
