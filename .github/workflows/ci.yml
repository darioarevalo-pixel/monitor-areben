name: CI — typecheck, lint, tests y build

# Hasta ahora el repo tenía 6 workflows y los 6 eran de sync: no había ninguna
# verificación automática. El único "test" era que la página cargara en producción.
#
# Son DOS jobs a propósito, y la división importa:
#
#   verificar → rápido, sin red, bloquea cada push. Es el que tiene que estar
#               siempre verde: si se pone rojo, es culpa del código.
#   paridad   → compara el ETL nuevo contra el legacy con datos REALES, que hay
#               que bajarse de Supabase. Depende de una base ajena con statement
#               timeout, así que puede fallar por razones que no son el código.
#
# Por qué separados: el primer intento los tenía juntos y el CI nació rojo — la
# descarga del fixture se comió un `statement timeout` (57014) en la tabla ventas.
# Un CI que se pone rojo por un timeout ajeno es un CI que el equipo aprende a
# ignorar, y ahí deja de servir para algo. El gate que bloquea tiene que depender
# solo de este repo.

# 🔒 Acá el candado SÍ cancela: si llegan dos pushes seguidos a la misma rama, el resultado del
# primero ya no le sirve a nadie y son ~4 minutos de Actions por corrida (son dos jobs). Es lo
# contrario del criterio de los syncs, donde cancelar dejaría datos a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

# ⚡ 18-nov: las cuatro revisiones (typecheck, lint, tests, build) iban EN FILA en un solo job: ~7 min de espera
# por cada publicación. Ahora corren EN PARALELO (tests partido en dos), y «Verificar» es sólo el cierre que junta
# los resultados: tarda lo que la más larga (~3 min). Revisan exactamente lo mismo que antes.
# ⛔ El nombre «Verificar (typecheck, lint, tests sin red, build)» NO se cambia: es el check que exige la traba de
# main (ruleset 26761098). ⛔ Y el cierre corre con `always()` y exige success de CADA una: si quedara «skipped» por
# una falla de arriba, GitHub cuenta skipped como aprobado y main dejaría pasar un commit roto.

permissions:
  contents: read
  checks: read

jobs:
  # 🔁 La receta de publicar es: push a la rama → CI verde → push del MISMO commit a main. Ese segundo push volvía a
  # correr todo sobre un commit que ya estaba verde (la mitad de los minutos de Actions, a la basura). Si el commit
  # ya tiene «Verificar» en verde, en main no se repite. Un merge de PR crea un commit NUEVO: ése sí se revisa.
  ya-verificado:
    name: ¿Este commit ya pasó?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      saltar: ${{ steps.mirar.outputs.saltar }}
    steps:
      - id: mirar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          saltar=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=Verificar%20(typecheck,%20lint,%20tests%20sin%20red,%20build)&per_page=100" \
                  --jq '[.check_runs[] | select(.conclusion=="success")] | length' || echo 0)
            [ "${n:-0}" -gt 0 ] && saltar=true
          fi
          echo "saltar=$saltar" >> "$GITHUB_OUTPUT"
          echo "Ya verificado antes: $saltar"

  typecheck:
    name: Typecheck
    needs: ya-verificado
    if: needs.ya-verificado.outputs.saltar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # El proyecto entero ya está al borde del tope de memoria por defecto de Node: medido 15-nov, main se queda sin memoria
      # con 1,6 GB y el CI cayó dos veces seguidas por eso («heap out of memory», exit 134) sin ningún error de tipos.
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

  lint:
    name: Lint
    needs: ya-verificado
    if: needs.ya-verificado.outputs.saltar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint

  # ⚠️ NO incluyen la paridad del ETL: sin el fixture, etl-paridad.test.ts hace it.skip (tests/etl-paridad.test.ts:41).
  # O sea que el verde de ESTE job no dice nada sobre si el ETL portado calcula igual que el legacy. Eso lo dice el
  # job `paridad`. Es una división deliberada, no un olvido.
  # Partido en dos mitades (`--shard`) que corren a la vez: entre las dos corren TODOS los archivos, cada uno una vez.
  tests:
    name: Tests sin red (${{ matrix.parte }}/2)
    needs: ya-verificado
    if: needs.ya-verificado.outputs.saltar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Tests que no necesitan datos reales
        run: npx vitest run --shard=${{ matrix.parte }}/2

  # `next build` vuelve a chequear los tipos de TODO el proyecto, en su propio proceso: el mismo tope que el Typecheck.
  # Sin esto se caía DESPUÉS de «Compiled successfully» con «heap out of memory» (16-nov: main 03:18 y 03:29, PR #63),
  # a veces sí y a veces no con el mismo commit ⇒ Verificar rojo ⇒ Publicar frenado por «Repository rule violations».
  build:
    name: Build
    needs: ya-verificado
    if: needs.ya-verificado.outputs.saltar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  verificar:
    name: Verificar (typecheck, lint, tests sin red, build)
    needs: [ya-verificado, typecheck, lint, tests, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Juntar los resultados
        run: |
          if [ "${{ needs.ya-verificado.result }}" = "success" ] && [ "${{ needs.ya-verificado.outputs.saltar }}" = "true" ]; then
            echo "Este mismo commit ya pasó Verificar en su rama: no se repite."
            exit 0
          fi
          echo "typecheck=${{ needs.typecheck.result }} lint=${{ needs.lint.result }} tests=${{ needs.tests.result }} build=${{ needs.build.result }}"
          for r in "${{ needs.ya-verificado.result }}" "${{ needs.typecheck.result }}" "${{ needs.lint.result }}" "${{ needs.tests.result }}" "${{ needs.build.result }}"; do
            [ "$r" = "success" ] || { echo "::error::Una revisión no pasó ($r)."; exit 1; }
          done

  # La copia del motor (`motor/`) tiene que ser de `main` de areben-motor (auditoría 20-oct). Job aparte: pide red y un
  # token (MOTOR_LECTURA), y `verificar` es sin red a propósito. ⛔ hace npm ci: el script es Node pelado.
  motor-en-main:
    name: La copia del motor es de main del motor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/motor-en-main.mjs
        env:
          MOTOR_LECTURA: ${{ secrets.MOTOR_LECTURA }}

  paridad:
    name: Paridad del ETL contra el legacy (datos reales)
    needs: ya-verificado
    if: needs.ya-verificado.outputs.saltar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # El fixture son ~20 MB de ventas reales y no está en el repo (.gitignore).
      # Se cachea por día: así Supabase recibe una descarga diaria y no una por push.
      - name: Caché del fixture (una descarga por día)
        id: cache-fixture
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: fixture-etl-${{ hashFiles('scripts/fixture-etl.mjs') }}-${{ github.run_id }}
          restore-keys: |
            fixture-etl-${{ hashFiles('scripts/fixture-etl.mjs') }}-

      # 🔴 Va con las claves de SERVICIO, no con las anon. Desde la Fase S (14-ago-2026) la anon
      # tiene revocados `productos.unit_cost`, `inventario` y las tres vistas materializadas, que
      # son justo lo que pide el fixture: PostgREST contestaba 401 y este job quedó rojo desde
      # entonces: la última corrida verde es del 14-ago 20:05 UTC y atrás vinieron 36 seguidas en
      # rojo, en las que su rojo tapó cualquier rojo real. Los dos secrets ya existían
      # (los usan los ocho workflows de sync), así que no hubo que crear ninguno.
      #
      # Con reintentos porque Supabase corta la query de `ventas` por statement timeout de forma
      # intermitente (57014) — pasó en el primer run de este CI. ⚠️ Ese mensaje fue el que tapó
      # esto durante dos semanas: decía "timeout" cuando el error era de permiso. Ahora el script
      # corta antes de la red si la clave falta, es anon o está cruzada de marca, y lo dice.
      - name: Bajar el fixture de datos reales
        if: steps.cache-fixture.outputs.cache-hit != 'true'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
        run: |
          for intento in 1 2 3; do
            if npm run fixture-etl; then exit 0; fi
            echo "::warning::Intento $intento falló. Si el mensaje habla de la clave, es permiso y reintentar no lo arregla; si no, Supabase suele cortar ventas por statement timeout. Reintentando en $((intento * 20))s…"
            sleep $((intento * 20))
          done
          echo "::error::No se pudo bajar el fixture después de 3 intentos."
          exit 1

      # ⚠️ Sin esto el job miente. Los tests de paridad hacen `it.skip` cuando falta
      # el fixture, así que si la descarga fallara a medias vitest pasaría en verde
      # SIN haber comparado un solo número. Ese verde es peor que no tener CI.
      - name: Verificar que el fixture está de verdad
        run: |
          for f in tests/fixtures/etl-bdi.json tests/fixtures/etl-zattia.json; do
            if [ ! -s "$f" ]; then
              echo "::error::Falta $f — los tests de paridad se skipearían y el verde no valdría nada."
              exit 1
            fi
          done
          echo "Fixture OK: $(du -sh tests/fixtures | cut -f1)"

      - name: Tests de paridad
        run: npm test
