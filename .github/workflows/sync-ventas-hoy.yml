name: Sync ventas recientes

# 🔑 **La marca va en el TÍTULO del run porque es el único lugar donde el Monitor puede verla.**
# La API de GitHub no devuelve los `inputs` al listar runs, así que `bdi-catalogo/api/sync.js`
# pedía el último run del workflow y lo daba por tuyo fuera de la marca que fuera: un sync de
# Zattia disparado por otra persona le decía «listo» a quien estaba esperando BDI. Con esto el
# `display_title` trae la marca y el estado se puede filtrar.
run-name: Sync ventas recientes — ${{ inputs.store }}

# 🔒 **Los ocho workflows que hablan con Gestión Nube comparten UN candado.** No es paranoia de
# libro: `scripts/lib/gn-rate-limit.mjs:12` documenta que "el diario del 11-ago hizo 29 páginas
# seguidas antes de chocar y el rápido del 12 chocó a la séptima, así que hay una ventana más larga
# que no conocemos". Esa firma —cortes que no se explican por el volumen de UNA corrida— es
# exactamente la de dos jobs compartiendo cupo. Y hasta hoy nada impedía que se pisaran: los dos
# diarios están agendados en el MISMO minuto (`0 6 * * *`) y cualquiera podía disparar un sync a
# mano encima. `cancel-in-progress: false` porque un sync a medias no se cancela, se espera.
concurrency:
  group: gestion-nube
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Marca (bdi o zattia)'
        required: true
        default: 'bdi'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` y no `npm install`: instala EXACTAMENTE lo que dice package-lock.json. Con
      # `install`, un sync de producción resolvía dependencias frescas cada noche y podía traerse
      # una versión menor distinta a la fijada, sin que nadie lo pidiera ni se enterara.
      - name: Instalar dependencias
        run: npm ci

      - name: Sync ventas recientes
        env:
          INPUT_STORE: ${{ inputs.store }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GN_TOKEN: ${{ secrets.GN_TOKEN }}
          ZATTIA_SUPABASE_URL: ${{ secrets.ZATTIA_SUPABASE_URL }}
          ZATTIA_SUPABASE_KEY: ${{ secrets.ZATTIA_SUPABASE_KEY }}
          ZATTIA_SUPABASE_SERVICE_KEY: ${{ secrets.ZATTIA_SUPABASE_SERVICE_KEY }}
          GN_TOKEN_ZATTIA: ${{ secrets.GN_TOKEN_ZATTIA }}
        run: node scripts/sync-ventas-hoy.js
