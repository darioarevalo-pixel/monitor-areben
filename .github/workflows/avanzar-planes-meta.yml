name: Escaladas de Meta Ads

# Cada hora, en el minuto 20: lejos de las 06:30 de la foto y de las 07:00 de las reglas, para que
# la corrida que arranca el día encuentre la foto de hoy ya escrita en vez de decidir con la de ayer.
#
# 🔑 **Esto es lo único del módulo que ESCRIBE en Meta sin que nadie lo apriete**, y por eso el
# guardarraíl vive adentro del paso y no en el momento de armar el plan: antes de cada escalón se
# relee el diario de Meta, se mira la foto diaria y se pregunta si todavía corresponde. Si no, el
# paso queda `salteado` con el motivo escrito. Ver `lib/meta-ads/escalado.core.js`.
#
# ⛔ **Sólo avanza planes de tipo `escalar`.** Duplicar y crear siguen siendo del Panel: crean
# objetos, y un plan que se atasca creando cosas tiene que atascarse delante de alguien.
#
# ⚠️ A diferencia de `meta-reglas.yml`, éste **sí** necesita `META_ADS_TOKEN`.
# 🔒 Candado propio: éste escribe en Meta sin que nadie lo apriete. Con el cron horario, una
# corrida que se pasara de los 60 minutos arrancaría encima de sí misma y habría dos procesos
# avanzando los mismos planes sobre cuentas publicitarias reales. Hoy tarda ~34 s, así que es un
# seguro, no un problema actual. `cancel-in-progress: false`: un escalón a medias se espera.
concurrency:
  group: meta-ads-escritura
  cancel-in-progress: false

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      simulacro:
        description: 'true = decide todo pero no escribe en Meta'
        required: false
        default: 'false'
      plan:
        description: 'Avanzar un solo plan, por id (vacío = todos los vencidos)'
        required: false
        default: ''

jobs:
  escalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # `npm ci` y no `npm install`: instala EXACTAMENTE lo que dice package-lock.json. Con
      # `install`, un sync de producción resolvía dependencias frescas cada noche y podía traerse
      # una versión menor distinta a la fijada, sin que nadie lo pidiera ni se enterara.
      - name: Instalar dependencias
        run: npm ci

      - name: Dar los escalones vencidos
        env:
          # La base de BDI: las tablas del motor son cross-marca porque las cuentas son compartidas.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 🔴 Este script escribe: sin el token se corta antes de leer nada, para no consumirle los
          # reintentos a una escalada por una credencial que falta.
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ENTRADA_SIMULACRO: ${{ inputs.simulacro }}
          ENTRADA_PLAN: ${{ inputs.plan }}
        run: |
          args=""
          [ "$ENTRADA_SIMULACRO" = "true" ] && args="$args --simulacro"
          [ -n "$ENTRADA_PLAN" ] && args="$args --plan $ENTRADA_PLAN"
          node scripts/avanzar-planes-meta.mjs $args
