<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ficha del cliente</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
      /* El panel ocupa todo y el aviso queda abajo, en una franja: sin chat abierto el panel sigue
         sirviendo —muestra la lista del día— y el aviso sólo explica por qué no hay ficha. */
      body { display: flex; flex-direction: column; }
      iframe { border: 0; width: 100%; flex: 1; display: block; }
      #aviso { padding: 8px 12px; color: #6b7280; font-size: 12px; border-top: 1px solid #e5e7eb; background: #f9fafb; }
    </style>
  </head>
  <body>
    <iframe id="panel" title="Ficha del cliente"></iframe>
    <div id="aviso">Abrí el chat de una persona en WhatsApp Web.</div>
    <script src="sidepanel.js"></script>
  </body>
</html>
