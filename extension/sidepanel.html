<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ficha del cliente</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
      /* El panel ocupa todo y el aviso queda abajo, en una franja: sin chat abierto el panel sigue
         sirviendo —muestra la lista del día— y el aviso sólo explica por qué no hay ficha. */
      body { display: flex; flex-direction: column; }
      iframe { border: 0; width: 100%; flex: 1; display: block; }
      #aviso { padding: 8px 12px; color: #6b7280; font-size: 12px; border-top: 1px solid #e5e7eb; background: #f9fafb; }
    </style>
  </head>
  <body>
    <!-- ⚠️ `allow` es lo que deja copiar desde adentro del panel: sin esto el navegador rechaza
         `navigator.clipboard` por venir de otro origen, y copiar el alias de una cuenta para
         pasárselo a un cliente caía al cuadro de "copiá esto a mano" (21-sep-2026). El monitor
         tiene un segundo camino que funciona igual sin este permiso, pero éste es el bueno.
         ⛔ Cambiar esta línea pide RECARGAR la extensión en chrome://extensions. -->
    <iframe id="panel" title="Ficha del cliente" allow="clipboard-write"></iframe>
    <div id="aviso">Abrí el chat de una persona en WhatsApp Web.</div>
    <script src="sidepanel.js"></script>
  </body>
</html>
